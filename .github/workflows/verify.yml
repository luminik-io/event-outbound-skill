name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    # Pull requests can contain untrusted workflow changes, so they must stay on
    # GitHub-hosted isolation. Only the trusted main-branch push uses the
    # organization runner.
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","luminik-org"]') }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npm run build

      - name: Tests (vitest)
        run: npm run test -- --run

      - name: Dependency compatibility
        run: npm run test:dependency-compat

      - name: Validator scan against shipped deliverables
        run: npm run scan
