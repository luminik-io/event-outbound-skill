name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    # Both events run on Blacksmith now, and the isolation the split existed to
    # protect is preserved rather than given up: a Blacksmith runner is an
    # ephemeral per-job VM, so an untrusted pull request gets a clean machine
    # that is destroyed afterwards, which is what GitHub-hosted was buying. The
    # persistent self-hosted box, which was the thing actually worth worrying
    # about for a trusted push, is gone entirely.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npm run build

      - name: Tests (vitest)
        run: npm run test -- --run

      - name: Dependency compatibility
        run: npm run test:dependency-compat

      - name: Validator scan against shipped deliverables
        run: npm run scan
