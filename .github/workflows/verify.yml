name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Standard GitHub-hosted runners are free for this public repository.
    # Every job still gets an ephemeral VM, including untrusted pull requests.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.148.0-alpha.9

      - name: Type-check (tsc)
        run: npm run build

      - name: Tests (vitest)
        run: npm run test -- --run

      - name: Dependency compatibility
        run: npm run test:dependency-compat

      - name: Validator scan against shipped deliverables
        run: npm run scan

      - name: Cross-client manifest checks
        run: npm run check:clients

      - name: Isolated Codex marketplace install and load
        run: npm run check:codex-install

      - name: Install verifier without Claude
        run: bash scripts/verify-install.sh --skip-live
